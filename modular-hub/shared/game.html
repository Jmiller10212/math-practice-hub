<section id="game" hidden>
<div class="topline"><button id="back" class="quiet">← Number Sense</button><span id="game-tag" class="tag">Shuffled every problem</span></div>
<h1 id="title" style="font-size:clamp(28px,4vw,36px)"></h1><p id="description" class="muted"></p>
<div class="toolbar"><label for="level">Difficulty<select id="level"><option value="3">Thousands · 4 digits</option><option value="6" selected>Millions · 7 digits</option><option value="9">Billions · 10 digits</option></select></label><div class="stats"><div class="stat"><span>Perfect first tries</span><strong id="score">0 / 0</strong></div><div class="stat"><span>Solved</span><strong id="solved">0</strong></div></div></div>
<div id="arithmetic-controls" class="toolbar" hidden><label id="arithmetic-kind-label" for="arithmetic-kind">Number type<select id="arithmetic-kind"><option value="whole">Whole Numbers</option><option value="decimals">Decimals</option><option value="mixed">Mixed</option></select></label><label id="arithmetic-precision-label" for="arithmetic-precision" hidden>Decimal places<select id="arithmetic-precision"><option value="1">Tenths</option><option value="2">Up to hundredths</option><option value="3">Up to thousandths</option></select></label><label for="arithmetic-level">Difficulty<select id="arithmetic-level"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label><label for="multiplication-top-size" id="multiplication-top-label" hidden>Top number size<select id="multiplication-top-size"><option value="1">Ones (1–9)</option><option value="2">Tens (10–99)</option><option value="3">Hundreds (100–999)</option><option value="4">Thousands (1,000–9,999)</option><option value="mixed">Mixed (random size per problem)</option><option value="custom">Custom</option></select></label><label id="multiplication-top-custom-label" for="multiplication-top-custom" hidden>Custom top number <input id="multiplication-top-custom" class="custom-factor" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" value="2" aria-describedby="multiplication-top-error"><span id="multiplication-top-error" class="custom-error bad-text" role="status"></span></label><label for="multiplication-bottom-size" id="multiplication-bottom-label" hidden>Bottom number size<select id="multiplication-bottom-size"><option value="1">Ones (1–9)</option><option value="2">Tens (10–99)</option><option value="3">Hundreds (100–999)</option><option value="4">Thousands (1,000–9,999)</option><option value="mixed">Mixed (random size per problem)</option><option value="custom">Custom</option></select></label><label id="multiplication-bottom-custom-label" for="multiplication-bottom-custom" hidden>Custom bottom number <input id="multiplication-bottom-custom" class="custom-factor" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" value="2" aria-describedby="multiplication-bottom-error"><span id="multiplication-bottom-error" class="custom-error bad-text" role="status"></span></label><label for="arithmetic-layout">Layout<select id="arithmetic-layout"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select></label></div>
<div id="decomposition-controls" class="toolbar" hidden><label for="decomposition-level">Difficulty<select id="decomposition-level"><option value="thousands">Thousands</option><option value="millions">Millions</option><option value="billions">Billions</option><option value="mixed">Mixed</option></select></label><label for="decomposition-mode">Mode<select id="decomposition-mode"><option value="standard">Standard</option><option value="regrouped">Regrouped</option><option value="mixed">Mixed</option></select></label><label id="expression-mode-label">Question<select id="expression-mode"><option value="correct">Which describes?</option><option value="not">Which does NOT describe?</option><option value="mixed">Mixed questions</option></select></label><label id="expression-length-label">Round length<select id="expression-length"><option value="5">5 questions</option><option value="10">10 questions</option></select></label><button id="expression-restart" type="button">Start new round ↻</button><span id="expression-round" role="status" aria-live="polite"></span></div>
<div id="write-expanded-controls" class="toolbar" hidden><label for="write-expanded-level">Difficulty<select id="write-expanded-level"><option value="thousands">Thousands</option><option value="millions">Millions</option><option value="billions">Billions</option><option value="mixed">Mixed</option></select></label></div>
<div id="decimal-controls" class="toolbar" hidden><label><input type="checkbox" id="include-decimals"> Include Decimals</label><label id="decimal-depth-label" for="decimal-depth" hidden>Decimal places<select id="decimal-depth"><option value="1">Tenths</option><option value="2">Hundredths</option><option value="3">Thousandths</option><option value="4">Ten-thousandths</option><option value="5">Hundred-thousandths</option></select></label></div>
<form id="quiz" class="panel" novalidate><div class="eyebrow" id="problem-label"></div><div class="problem"><div id="problem" class="problem-number"></div></div><div id="boxes" class="boxes"></div><div class="actions"><button class="primary" type="submit" id="check">Check answers</button><button type="button" id="next">New Problem ↻</button><button type="button" id="hint">Show hint</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="hint-text" class="hint" hidden>Read place values from the right: Ones, Tens, Hundreds, then Thousands, Ten Thousands, and so on. Each step left is worth ten times as much. In expanded form, a missing place means its digit is 0.</div></form>
</section>
